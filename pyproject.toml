[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-lab"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["dishka>=1.4,<2", "PySide6>=6.7,<7", "cryptography>=42", "pytest>=8,<10"]

[project.scripts]
crypto-lab = "crypto_lab.cli.main:main"
crypto-lab-gui = "crypto_lab.gui.app:main"

[tool.setuptools.packages.find]
include = ["crypto_lab*"]

[tool.setuptools.package-data]
crypto_lab = ["data/*.json", "docs/*", "reports/*"]
